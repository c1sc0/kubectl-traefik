apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: traefik
spec:
  version: {{ .TagName }}
  homepage: https://github.com/c1sc0/kubectl-traefik
  shortDescription: List, match and debug Traefik routes
  description: |
    Reads IngressRoute, Ingress and HTTPRoute objects served by Traefik
    and shows them as one routing table with the Traefik rule for each.

    Commands:
      routes  list every Traefik route with rule, services, middlewares and TLS
      doctor  find missing Services, ports, Middlewares, TLS secrets and
              TLSOptions, cross-namespace references and failing HTTPRoutes
      match   show which route serves a URL

    Works from the Kubernetes API only, no access to the Traefik API needed.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-traefik
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-traefik
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-traefik
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-traefik
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_windows_amd64.zip" .TagName }}
    bin: kubectl-traefik.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/c1sc0/kubectl-traefik/releases/download/{{ .TagName }}/kubectl-traefik_windows_arm64.zip" .TagName }}
    bin: kubectl-traefik.exe
